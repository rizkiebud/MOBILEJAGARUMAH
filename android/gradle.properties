# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android
android.useAndroidX=true
android.enableJetifier=false

# React Native — New Architecture dinonaktifkan sementara
# karena beberapa package (react-native-vector-icons, react-native-chart-kit)
# belum sepenuhnya mendukung Fabric/TurboModules.
# Aktifkan kembali setelah semua package kompatibel.
newArchEnabled=false
hermesEnabled=true
